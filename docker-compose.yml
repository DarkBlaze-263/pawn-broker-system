version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pawn_broker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: pawn_broker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    networks:
      - pawn_broker_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawn_broker_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ./data/pawn_broker.db
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LOG_LEVEL: error
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pawn_broker_network
    volumes:
      - ./backend/logs:/app/logs
      - backend_data:/app/data

  # Frontend (for local development only)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pawn_broker_frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_ENVIRONMENT: production
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - pawn_broker_network

networks:
  pawn_broker_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_data:
    driver: local
